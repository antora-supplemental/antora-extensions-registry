name: Deploy to Netlify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Snapshot extension catalog
        run: pnpm catalog:snapshot
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build site
        run: pnpm build
        env:
          NODE_ENV: production
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          REGISTRY_CATALOG_ONLY: "false"
          BETTER_AUTH_URL: ${{ vars.BETTER_AUTH_URL || 'https://registry.antora-supplemental.org' }}
          DB_URL: ${{ secrets.DB_URL }}
          DB_AUTH_TOKEN: ${{ secrets.DB_AUTH_TOKEN }}

      - name: Deploy to Netlify
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          PROD=""
          if [ "${{ github.ref }}" = "refs/heads/main" ] && [ "${{ github.event_name }}" != "pull_request" ]; then PROD="--prod"; fi
          npx -y netlify-cli@latest deploy --no-build $PROD \
            --dir dist \
            --functions .netlify/functions-internal \
            --message "Deploy ${{ github.sha }}"